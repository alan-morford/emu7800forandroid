# Java 17 required by AGP 8.2. Install via: sudo apt-get install -y openjdk-17-jdk
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Redirect all build outputs to the native Linux filesystem so that CMake
# and Gradle don't hit OneDrive permission/delete errors in WSL.
# Override in local gradle.properties if building on Windows.
org.gradle.project.buildDir=/home/rad/Projects/android/build/EMU7800Android

# Gradle performance settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Android-specific
android.useAndroidX=true
