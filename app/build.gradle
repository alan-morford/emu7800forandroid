plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emu7800.android'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.emu7800.android"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-21",
                          "-DEMU7800_VERSION=${defaultConfig.versionName}"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            storeFile     file('release-key.jks')
            storePassword 'Emu7800@Secure#2024'
            keyAlias      'emu7800-release'
            keyPassword   'Emu7800@Secure#2024'
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    false
            shrinkResources  false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
            // Redirect CMake work dir to native Linux filesystem to avoid
            // Windows/OneDrive file-write latency that breaks try_compile in WSL.
            buildStagingDirectory "/home/rad/Projects/android/build/EMU7800Android/.cxx"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No Java library dependencies needed — SDL2 supplies everything
}
